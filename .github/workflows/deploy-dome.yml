name: Deploy DOME

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dome-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Validate deployment configuration
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$CLOUDFLARE_DEPLOY_HOOK_URL" ]; then
            echo "::error::CLOUDFLARE_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

      - name: Trigger Cloudflare production build from main
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          curl             --fail-with-body             --silent             --show-error             --retry 3             --retry-all-errors             --connect-timeout 15             --max-time 60             --request POST             "$CLOUDFLARE_DEPLOY_HOOK_URL"
          echo
          echo "Cloudflare deploy hook accepted for ${GITHUB_SHA}."

      - name: Verify DOME admin security controls in production
        env:
          PRODUCTION_ADMIN_URL: https://dome-dashboard.dominion1st-integrated-management-system-dims.workers.dev/admin.html
        run: |
          for attempt in $(seq 1 40); do
            page="$(curl               --fail               --silent               --show-error               --location               --connect-timeout 15               --max-time 30               "${PRODUCTION_ADMIN_URL}?deployment_check=${GITHUB_SHA}" || true)"

            if printf '%s' "$page" | grep --fixed-strings --quiet 'id="password-sign-in"' &&
               printf '%s' "$page" | grep --fixed-strings --quiet 'id="security-card"' &&
               printf '%s' "$page" | grep --fixed-strings --quiet '>Account Security<' &&
               printf '%s' "$page" | grep --fixed-strings --quiet 'id="set-password"'; then
              echo "Production verification passed."
              exit 0
            fi

            echo "Attempt ${attempt}/40: waiting 15 seconds for production..."
            sleep 15
          done

          echo "::error::Production did not expose the required admin security controls within 10 minutes."
          exit 1
