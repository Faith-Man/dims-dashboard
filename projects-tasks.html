    .drawer-backdrop{position:fixed;inset:0;z-index:10000;background:rgba(6,15,36,.56);opacity:0;pointer-events:none;transition:.18s}.drawer-backdrop.open{opacity:1;pointer-events:auto}.detail-drawer{position:absolute;top:0;right:0;width:min(72vw,1180px);min-width:min(760px,94vw);height:100%;overflow:auto;background:#fff;color:var(--ink);box-shadow:-16px 0 40px rgba(0,0,0,.24);transform:translateX(100%);transition:.2s}.drawer-backdrop.open .detail-drawer{transform:translateX(0)}.drawer-header{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:18px;background:#0c1475;color:#fff}.drawer-close{border:1px solid rgba(255,255,255,.55);border-radius:50%;width:36px;height:36px;background:transparent;color:#fff;cursor:pointer;font-size:1.2rem}.drawer-content{padding:20px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail-field{border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}.detail-field.full{grid-column:1/-1}.detail-field dt{color:var(--muted);font-size:.7rem;text-transform:uppercase}.detail-field dd{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.control-block{margin-top:16px;border-top:3px solid #0c1475;padding-top:14px}.control-title{font-weight:800;color:#0c1475;margin-bottom:10px}.control-actions{display:flex;gap:8px;flex-wrap:wrap}.control-actions button,.clear-filter{border:1px solid var(--gold3);background:#fff;color:#0c1475;border-radius:7px;padding:7px 10px;font-weight:700;cursor:pointer}.history-item{border-left:4px solid #0c1475;padding:8px 10px;margin:8px 0;background:#f7f9fd}.history-item strong{display:block}.identity-note{color:var(--muted);font-size:.72rem}

    @media(max-width:900px){.accountability-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.section-title{align-items:stretch;flex-direction:column;gap:8px}.header-search{width:100%;max-width:none}.dims-grid,.dims-grid tbody,.dims-grid tr,.dims-grid td{display:block;width:100%!important}.dims-grid thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.dims-grid tbody{display:grid;gap:12px}.dims-grid tr{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.dims-grid td{display:grid;grid-template-columns:34% 1fr;gap:8px;padding:7px 4px}.dims-grid td::before{content:attr(data-label);font-weight:750;color:#0c1475}.view-button{width:100%}.detail-drawer{top:auto;bottom:0;width:100%;min-width:0;height:min(92vh,900px);border-radius:16px 16px 0 0;transform:translateY(100%)}.drawer-backdrop.open .detail-drawer{transform:translateY(0)}#projectsList,#tasksList{margin-left:0;margin-right:0;margin-bottom:0}}

<div class="page-header"><div><div class="page-title">✅ TETELESTAI™</div><div class="page-sub">Projects, Tasks, Assignments &amp; Completion</div></div><a href="index.html" style="color:var(--gold);font-size:.8rem;border:1px solid var(--gold3);padding:6px 12px;text-decoration:none">← Home</a></div>
<nav class="nav-pills"><a class="nav-pill" href="mission-control.html">🎯 Mission Control</a><a class="nav-pill active" href="projects-tasks.html">✅ TETELESTAI™</a><a class="nav-pill" href="institutional-queue.html">⏳ Inst. Queue</a><a class="nav-pill" href="dashboard-v3.html">⚙ System</a></nav>
<div class="wrap">
  <section id="accountabilitySummary" class="accountability-strip" aria-label="Accountability summary"><div class="loading">Loading accountability…</div></section>
  <div id="activeFilter" class="active-filter"><span id="activeFilterText"></span><button class="clear-filter" id="clearSummaryFilter">Clear Filter</button></div>

  <div class="card">
    <div class="section-title">
      <div class="section-title-label">📂 Projects <span id="projCount"></span></div>
      <input id="projectSearch" class="header-search" type="search" placeholder="Search project number, project, stream, status, or priority..." aria-label="Search projects">
    </div>
    <div id="projectsList" class="loading">Loading…</div>
  </div>

  <div class="card">
    <div class="section-title">
      <div class="section-title-label">✅ Tasks <span id="taskCount"></span></div>
      <input id="taskSearch" class="header-search" type="search" placeholder="Search task number, task, notes, status, or priority..." aria-label="Search tasks">
    </div>
    <div id="tasksList" class="loading">Loading…</div>
  </div>

  <div class="grid2"><div class="card"><div class="card-title">+ Add Project</div><input id="p_title" placeholder="Project title"><input id="p_desc" placeholder="Description"><select id="p_status"><option value="open">Open</option><option value="active">Active</option><option value="in_progress">In Progress</option><option value="complete">Complete</option><option value="deferred">Deferred</option><option value="blocked">Blocked</option></select><select id="p_priority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select><input id="p_stream" placeholder="Stream (e.g. DIMS, VAULT)"><button class="btn" onclick="saveProject()">💾 Save Project</button><span id="pMsg" class="loading"></span></div><div class="card"><div class="card-title">+ Add Task</div><input id="t_title" placeholder="Task title"><input id="t_notes" placeholder="Notes"><select id="t_status"><option value="open">Open</option><option value="active">Active</option><option value="in_progress">In Progress</option><option value="complete">Complete</option><option value="deferred">Deferred</option><option value="blocked">Blocked</option></select><select id="t_priority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select><button class="btn" onclick="saveTask()">💾 Save Task</button><span id="tMsg" class="loading"></span></div></div>
</div>
<div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true"><aside class="detail-drawer" id="detailDrawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="-1"><header class="drawer-header"><div><div class="row-meta" id="drawerKind"></div><h2 id="drawerTitle">Details</h2></div><button class="drawer-close" id="drawerClose" aria-label="Close details">×</button></header><div class="drawer-content" id="drawerContent"></div></aside></div>
<div class="scripture-bar">"Commit your works to the Lord, and your thoughts will be established." <strong>— Proverbs 16:3</strong></div>
<script>
(() => {
  const showFailure = detail => {
    const text = `Unable to load TETELESTAI: ${detail}`;
    const projects = document.getElementById('projectsList');
    const tasks = document.getElementById('tasksList');
    const summary = document.getElementById('accountabilitySummary');
    if (projects?.classList.contains('loading')) projects.textContent = text;
    if (tasks?.classList.contains('loading')) tasks.textContent = text;
    if (summary?.querySelector('.loading')) summary.innerHTML = `<div class="loading">${text}</div>`;
  };
  window.__tetelestaiInitTimer = setTimeout(() => showFailure('application initialization timed out.'), 12000);
  window.addEventListener('error', event => showFailure(event?.message || 'browser module initialization failed.'));
  window.addEventListener('unhandledrejection', event => showFailure(event?.reason?.message || String(event?.reason || 'unhandled initialization failure.')));
})();
</script>
