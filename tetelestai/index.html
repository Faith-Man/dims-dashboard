<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TETELESTAI™ — Integrated DOME Test</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#eef5ff}.top{height:86px;background:linear-gradient(135deg,#050b3d,#0c1475 62%,#13258f);color:#fff;border-bottom:2px solid #d5ad45;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(14px,3vw,34px)}.brand small{display:block;font-size:.7rem;letter-spacing:.13em;font-weight:800}.brand strong{font-family:Georgia,serif;font-size:1.45rem;letter-spacing:.08em}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}.actions a,.add-menu summary{color:white;text-decoration:none;border:1px solid #8eb4ef;border-radius:999px;padding:7px 10px;font-size:.78rem;font-weight:700}.add-menu{position:relative}.add-menu summary{list-style:none;cursor:pointer;background:#fff;color:#0c1475;border-color:#fff}.add-menu summary::-webkit-details-marker{display:none}.add-panel{position:absolute;right:0;top:calc(100% + 7px);z-index:20;width:170px;background:#fff;border:1px solid #c8d8ff;border-radius:12px;padding:7px;box-shadow:0 14px 32px rgba(5,11,61,.24)}.add-panel button{display:block;width:100%;border:0;background:#fff;color:#0c1475;text-align:left;padding:10px;border-radius:8px;font-weight:800;cursor:pointer}.add-panel button:hover,.add-panel button:focus-visible{background:#eef5ff;outline:none}.frame{width:100%;height:calc(100vh - 86px);border:0;background:white}@media(max-width:620px){.top{height:auto;min-height:112px;align-items:flex-start;flex-direction:column}.frame{height:calc(100vh - 112px)}.actions{justify-content:flex-start}.add-panel{right:auto;left:0}}
</style></head><body><header class="top"><div class="brand"><small>DOME™ · EXECUTION & COMPLETION</small><strong>TETELESTAI™</strong></div><nav class="actions"><details class="add-menu"><summary>+ Add ▾</summary><div class="add-panel"><button type="button" data-add="project">+ Add Project</button><button type="button" data-add="task">+ Add Task</button></div></details><a href="../prototypes/dome-eight-module-home/">DOME Home</a><a href="../orel/">OrEl™</a><a href="../yaratheke/">YARATHĒKĒ™</a></nav></header><iframe id="tet" class="frame" src="../projects-tasks.html" title="TETELESTAI Projects and Tasks"></iframe><script>
const f=document.getElementById('tet');let pendingAdd=null;
function jumpToAdd(kind){try{const d=f.contentDocument;const target=d.getElementById(kind==='project'?'p_title':'t_title');if(!target){pendingAdd=kind;return}target.closest('.card')?.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>target.focus(),350);document.querySelector('.add-menu')?.removeAttribute('open')}catch(e){console.warn('TETELESTAI add action unavailable',e)}}
document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>jumpToAdd(b.dataset.add)));
f.addEventListener('load',()=>{try{const d=f.contentDocument;d.querySelector('.page-header')?.remove();d.querySelector('.nav-pills')?.remove();d.body.style.paddingTop='0';const w=d.querySelector('.wrap');if(w){w.style.marginTop='12px'}if(pendingAdd){const k=pendingAdd;pendingAdd=null;jumpToAdd(k)}}catch(e){console.warn('Integrated shell could not adjust inner navigation',e)}});
</script><script src="../dome-global-nav.js" defer></script>
</body></html>
