name: Deploy DOME

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-dome.yml

permissions:
  contents: read

concurrency:
  group: dome-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Cloudflare production build from main
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$CLOUDFLARE_DEPLOY_HOOK_URL" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            "$CLOUDFLARE_DEPLOY_HOOK_URL"
          echo
          echo "Cloudflare deploy hook accepted."
