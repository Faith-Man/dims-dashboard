const SCRIPT_ONLY_LEN = POOL.filter(x=>x[0]==='s').length; // informational only

function dayKey(){
  const override = new URLSearchParams(location.search).get('today');
  if (override && /^\d{4}-\d{2}-\d{2}$/.test(override)) return override;
  const parts = new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const get=t=>parts.find(p=>p.type===t).value;
  return `${get('year')}-${get('month')}-${get('day')}`;
}
function epochDay(key){
  const [y,m,d]=key.split('-').map(Number);
  return Math.floor(Date.UTC(y,m-1,d)/86400000);
}
function hashIndex(key,mod){
  let x=(epochDay(key)+0x9e3779b9)|0;
  x=Math.imul(x^(x>>>16),0x85ebca6b);
  x=Math.imul(x^(x>>>13),0xc2b2ae35);
  x=x^(x>>>16);
  return (x>>>0)%mod;
}

    badge.textContent='SCRIPTURE';badge.className='kind scripture';
    text.textContent='“'+b+'”';
    source.innerHTML=a+' <span style="font-weight:600;color:var(--muted)">KJV</span>';
  } else {
    badge.textContent='ATHLETIC';badge.className='kind athletic';
    text.textContent='“'+a+'”';
    const disputed = b.includes('disputed') || b.includes('commonly attributed');
    if (disputed) {
      const parts = b.split(' — ');
      source.innerHTML='— '+parts[0]+'<span class="disputed">'+(parts[1]||'attribution uncertain')+'</span>';
    } else {
      source.textContent='— '+b;
    }
  }
  document.getElementById('metaLine').textContent='For '+key+' · one new reflection each day, selected from a pool of '+POOL.length+'.';
}
render();
</script>
</body>
</html>
