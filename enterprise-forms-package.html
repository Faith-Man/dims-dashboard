<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIMS–V3 Enterprise Forms Package</title>
<style>
:root{--blue:#071B75;--gold:#B8860B;--bg:#eef4ff;--ink:#0B1638;--line:#d7e1ff;--muted:#5B688C}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink);padding:24px}
.wrap{max-width:960px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0}
h1,h2,label{color:var(--blue)}h1{font-size:clamp(32px,5vw,50px);margin:4px 0 24px}h2{font-size:clamp(28px,4vw,42px);margin:0 0 24px}
label{display:block;font-weight:700;font-size:clamp(22px,3vw,31px);margin:18px 0 8px}
input,select,textarea{width:100%;padding:15px 18px;border:1px solid var(--line);border-radius:10px;margin:5px 0 12px;font-size:clamp(18px,2.7vw,26px);color:var(--ink);background:#fff}
textarea{min-height:170px}.nav-grid{display:grid;grid-template-columns:1fr;gap:14px}.nav-btn,button{background:var(--blue);color:#fff;border:0;border-radius:14px;padding:18px 20px;width:100%;font-size:clamp(22px,3.4vw,34px);cursor:pointer}
.nav-btn.active{outline:5px solid var(--gold);outline-offset:3px}.actions{display:flex;gap:16px;flex-wrap:wrap;margin-top:24px}.actions button{width:auto;padding:16px 26px}.gold{background:var(--gold)!important}.small{color:var(--muted);font-size:clamp(17px,2.5vw,24px)}
pre{white-space:pre-wrap;word-break:break-word}.form-panel{display:none}.form-panel.active{display:block}.utility{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.utility a{color:var(--blue);font-weight:700;text-decoration:none}.save-status{font-size:16px;color:var(--muted)}
@media(min-width:760px){.nav-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){body{padding:14px}.card{padding:20px}.actions{flex-direction:column}.actions button{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="utility"><span><a href="index.html">← DOME Home</a> · <a href="enterprise-forms.html">Asset Registry</a> · <a href="quotes-library.html">Quotes Library</a></span><span id="authState" class="save-status">Checking DOME sign-in…</span></div>
    <h1>DIMS–V3 Enterprise Forms</h1>
    <div class="nav-grid">
      <button class="nav-btn active" data-target="mission">Mission Form</button>
      <button class="nav-btn" data-target="adr">ADR Form</button>
      <button class="nav-btn" data-target="standard">Standard Form</button>
      <button class="nav-btn" data-target="quote">Quote Form</button>
      <button class="nav-btn" data-target="verification">Verification Form</button>
      <button class="nav-btn" data-target="institutional">Institutional Queue Form</button>
    </div>
  </div>
  <div id="formsHost"></div>
  <div class="card"><h2>Output Preview</h2><pre id="output" class="small">Fill in the form and select Preview JSON.</pre></div>
</div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://sdquzhsylqpbhrmqjqgk.supabase.co','sb_publishable_volaz6N52Pc4rdh8a4dfEw_MjJ73How');
const forms={mission:{title:'Mission Form',artifact:'Mission'},adr:{title:'ADR Form',artifact:'ADR'},standard:{title:'Standard Form',artifact:'Standard'},quote:{title:'Quote Form',artifact:'Quote'},verification:{title:'Verification Form',artifact:'Verification Record'},institutional:{title:'Institutional Queue Form',artifact:'Queue Record'}};
let currentUser=null;
function markup(k,c){return `<section class="card form-panel ${k==='mission'?'active':''}" id="panel-${k}"><h2>${c.title}</h2><form id="form-${k}"><label>Enterprise ID</label><input name="enterprise_id"><label>Artifact Type</label><input name="artifact_type" value="${c.artifact}" readonly><label>Title</label><input name="title" required><label>Status</label><select name="status"><option>Draft</option><option>Proposed</option><option>Approved</option><option>Verification Pending</option><option>Verified</option><option>Archived</option></select><label>Description / Content</label><textarea name="content"></textarea><label>Verification Status</label><select name="verification_status"><option>Pending</option><option>Verified</option><option>Failed</option></select><label>Next Action</label><textarea name="next_action"></textarea><div class="actions"><button type="button" onclick="window.previewForm('${k}')">Preview JSON</button><button type="button" class="gold" onclick="window.downloadForm('${k}')">Download JSON</button><button type="button" onclick="window.saveForm('${k}')">Save to DIMS</button></div><p class="small">Showing ${c.title}.</p></form></section>`}
document.getElementById('formsHost').innerHTML=Object.entries(forms).map(([k,v])=>markup(k,v)).join('');
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.form-panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+b.dataset.target));document.getElementById('output').textContent='Fill in the form and select Preview JSON.'});
function data(k){const d={};new FormData(document.getElementById('form-'+k)).forEach((v,n)=>d[n]=v);d.generated_at=new Date().toISOString();return d}
window.previewForm=k=>{const d=data(k);document.getElementById('output').textContent=JSON.stringify(d,null,2);return d}
window.downloadForm=k=>{const d=window.previewForm(k),u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=(d.artifact_type||'enterprise-form').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.json';a.click();URL.revokeObjectURL(u)}
window.saveForm=async k=>{const out=document.getElementById('output');const {data:userData,error:userError}=await sb.auth.getUser();currentUser=userData?.user||null;if(userError||!currentUser){out.textContent='DOME sign-in required to save. Open Admin, sign in, then return here.';return}const d=data(k);const row={enterprise_id:d.enterprise_id||null,artifact_type:d.artifact_type,title:d.title||null,status:d.status||null,verification_status:d.verification_status||null,payload:d,created_by:currentUser.id,updated_at:new Date().toISOString()};const {data:saved,error}=await sb.from('enterprise_form_submissions').insert(row).select('id,created_at').single();out.textContent=error?'Save failed: '+error.message:JSON.stringify({...d,dims_submission_id:saved.id,saved_at:saved.created_at},null,2)}
async function initAuth(){const el=document.getElementById('authState');const {data,error}=await sb.auth.getUser();currentUser=data?.user||null;el.innerHTML=(!error&&currentUser)?'DOME authenticated · Save enabled':'Not signed in · <a href="admin.html">Sign in</a>'}
initAuth();
</script>
</body>
</html>
