<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <link rel="stylesheet" href="./styles.css" />

  <style>
    .topbar-actions{display:flex;align-items:center;gap:8px}
    .dome-menu{position:relative;z-index:30}
    .dome-menu summary{list-style:none;cursor:pointer;white-space:nowrap;border:1px solid rgba(255,255,255,.68);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:8px 12px;font-weight:800;font-size:.74rem;letter-spacing:.04em}
    .dome-menu summary::-webkit-details-marker{display:none}
    .dome-menu[open] summary{background:#fff;color:#0c1475}
    .dome-menu-panel{position:absolute;right:0;top:calc(100% + 8px);min-width:210px;padding:8px;background:#fff;border:1px solid #c8d8ff;border-radius:14px;box-shadow:0 16px 38px rgba(5,11,61,.24)}
    .dome-menu-panel a{display:block;text-decoration:none;color:#0c1475;font-weight:800;font-size:.78rem;padding:10px 11px;border-radius:9px}
    .dome-menu-panel a:hover,.dome-menu-panel a:focus-visible{background:#eef5ff;outline:none}
    @media(max-width:620px){.topbar-actions{align-self:flex-start}.dome-menu-panel{right:auto;left:0}}
  </style>
</head>
<body>
  <header class="topbar">

      <h1>YARATHĒKĒ™</h1>

    </div>
    <div class="topbar-actions">

    </div>
  </header>
