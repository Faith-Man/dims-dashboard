name: Deploy DOME

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dome-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy and verify production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate deployment configuration
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$CLOUDFLARE_DEPLOY_HOOK_URL" ]; then
            echo "::error::CLOUDFLARE_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

      - name: Trigger Cloudflare production build from main
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 --request POST \
            "$CLOUDFLARE_DEPLOY_HOOK_URL"
          echo
          echo "Cloudflare deploy hook accepted for ${GITHUB_SHA}."

      - name: Verify current RAD, TETELESTAI and MED production content
        env:
          BASE_URL: https://dome-dashboard.dominion1st-integrated-management-system-dims.workers.dev
        run: |
          for attempt in $(seq 1 40); do
            guide="$(curl --fail --silent --show-error --location --connect-timeout 15 --max-time 30 "${BASE_URL}/rac-epi-apn-guide.html?deployment_check=${GITHUB_SHA}" || true)"
            table="$(curl --fail --silent --show-error --location --connect-timeout 15 --max-time 30 "${BASE_URL}/projects-tasks.html?deployment_check=${GITHUB_SHA}" || true)"
            prefs="$(curl --fail --silent --show-error --location --connect-timeout 15 --max-time 30 "${BASE_URL}/dims-ui-preferences.js?deployment_check=${GITHUB_SHA}" || true)"
            med="$(curl --fail --silent --show-error --location --connect-timeout 15 --max-time 30 "${BASE_URL}/med-marriage-evaluation-dome-secure.html?deployment_check=${GITHUB_SHA}" || true)"
            deploy="$(curl --fail --silent --show-error --location --connect-timeout 15 --max-time 30 "${BASE_URL}/api/dome/deploy?deployment_check=${GITHUB_SHA}" || true)"

            if printf '%s' "$guide" | grep --fixed-strings --quiet 'Functional Risk Assessment Dome (RAD)' &&
               printf '%s' "$guide" | grep --fixed-strings --quiet 'EPI is retired as a separate priority layer.' &&
               printf '%s' "$table" | grep --fixed-strings --quiet 'dims-ui-preferences.js?v=1' &&
               printf '%s' "$table" | grep --fixed-strings --quiet 'data-dims-view="list"' &&
               printf '%s' "$table" | grep --fixed-strings --quiet 'data-dims-view="card"' &&
               printf '%s' "$prefs" | grep --fixed-strings --quiet "const THEME_KEY = 'dims.theme';" &&
               printf '%s' "$prefs" | grep --fixed-strings --quiet 'Dominion1st DOME™ / DIMS' &&
               printf '%s' "$deploy" | grep --fixed-strings --quiet 'fallback-badge-no-image-dependency' &&
               printf '%s' "$med" | grep --fixed-strings --quiet 'data-med-orb-runtime="fallback-badge"' &&
               printf '%s' "$med" | grep --fixed-strings --quiet '>MED</span>'; then
              echo "Production verification passed for RAD, TETELESTAI and MED fallback badge."
              exit 0
            fi

            echo "Attempt ${attempt}/40: production MED fallback verification is not current yet. deploy_marker=$(printf '%s' "$deploy" | tr -d '\n' | head -c 240)"
            sleep 15
          done

          echo "::error::Cloudflare production failed MED fallback verification. The deployment cannot be treated as successful until the MED page contains the fallback badge."
          exit 1
