<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DIMS Admin</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;max-width:860px;margin:24px auto;padding:0 16px}
    .card{border:1px solid #ddd;border-radius:8px;padding:16px;margin:16px 0}
    label{display:block;margin:8px 0 4px}
    input,textarea,select{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:6px}
    button{padding:10px 14px;border:1px solid #222;border-radius:6px;background:#222;color:#fff;cursor:pointer}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .hidden{display:none}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
    .muted{color:#555}
    .actions{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
    @media(max-width:640px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body data-auth-gate="server-verified-v3">
  <h1>DIMS Admin</h1>

  <div id="auth-card" class="card">
    <h2>Sign in</h2>
    <label>Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
    <label>Password</label>
    <input id="login-password" type="password" autocomplete="current-password" placeholder="Your DOME password" />
    <div class="actions">
      <button id="password-sign-in">Sign in with password</button>
      <button id="send-link" style="background:#555">Send magic link</button>
    </div>
    <p class="muted">Magic link remains available as a backup sign-in method.</p>
    <p id="auth-msg" class="mono"></p>
  </div>

  <div id="security-card" class="card hidden" hidden aria-hidden="true">
    <h2>Account Security</h2>
    <p class="muted">Set or change the password for the currently authenticated DOME account.</p>
    <label>New password</label>
    <input id="new-password" type="password" autocomplete="new-password" />
    <label>Confirm password</label>
    <input id="confirm-password" type="password" autocomplete="new-password" />
    <div class="actions">
      <button id="set-password">Set password</button>
    </div>
    <p id="security-msg" class="mono"></p>
  </div>

  <div id="editor-card" class="card hidden" hidden aria-hidden="true">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>Teaching Editor</h2>
      <button id="sign-out" style="background:#666">Sign out</button>
    </div>
    <div class="row"><div><label>Title</label><input id="title" placeholder="e.g., You Have Dominion" /></div><div><label>Slug</label><input id="slug" placeholder="you-have-dominion" /></div></div>
    <label>Status</label><select id="status"><option value="draft">draft</option><option value="published">published</option></select>
    <label>Scriptures (JSON array)</label><input id="scripture" class="mono" placeholder='[{"ref":"Genesis 1:26-28"}]' />
    <label>Tags (comma separated)</label><input id="tags" class="mono" placeholder="Dominion1st, Identity" />
    <label>Content (Markdown)</label><textarea id="content_md" rows="12" placeholder="## Heading&#10;Your message here..."></textarea>
    <div class="actions"><button id="save-draft">Save draft</button><button id="publish">Publish</button><button id="load" style="background:#0a7">Load by slug</button><button id="new" style="background:#555">New</button></div>
    <p id="save-msg" class="mono"></p>
  </div>

  <script type="module" src="./admin.js?v=server-verified-v3"></script>
</body>
</html>
